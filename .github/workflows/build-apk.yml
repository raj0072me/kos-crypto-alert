name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual one-click build from GitHub UI

jobs:
  build:
    name: Compile Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: 🛠️ Configure Android Platform
        working-directory: mobile
        run: |
          mkdir -p /tmp/res_backup
          cp -r android/app/src/main/res/* /tmp/res_backup/ || true
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create --platforms=android --org com.kanta .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          cp -r /tmp/res_backup/* android/app/src/main/res/ || true

      - name: 📦 Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: 🚀 Build Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact (Download from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: kos-crypto-alert-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
